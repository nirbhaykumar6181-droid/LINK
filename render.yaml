services:
  - type: web
    name: link-web
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: link-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: LINK_DATA_DIR
        value: /var/data
      - key: LINK_TRUST_PROXY
        value: "0"
